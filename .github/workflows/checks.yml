# Fast quality gates — the CLAUDE.md verification gates (typecheck, lint, test).
#
# Runs on EVERY push and pull request. Deliberately cheap: frontend-only, no
# Rust build and no ~1 GB asset download, so it finishes in a couple of minutes.
# The heavy installer build lives in release.yml and only runs on tags / manual
# dispatch — see that file.
name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch cancels an in-flight run for it.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The three gates from CLAUDE.md. tsc/eslint/vitest are pure frontend —
      # none of them need the bundled models or the Rust backend.
      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # `vitest` with no args auto-detects CI and runs once (no watch), but pass
      # `run` explicitly so it can never hang waiting for file changes.
      - name: Test
        run: bunx vitest run
