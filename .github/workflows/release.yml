# Installer build + update publish — builds the signed NSIS installer and
# publishes it (+ the update manifest) to Cloudflare R2. Every user then
# auto-updates from R2 (Cloudflare, always on), independent of where it built.
#
# TWO BUILD MODES, you choose per release:
#   * self-hosted  — your own Windows PC. Free minutes, fast (persistent
#                    target/), but the PC must be on. Assets come from a LOCAL
#                    folder (no download).
#   * cloud        — GitHub-hosted windows-latest. No PC needed; billed at 2x
#                    Windows minutes (mostly absorbed by the monthly free
#                    allotment). Private repo => private logs, no source
#                    exposure. Assets are fetched from the `assets-v4` release.
# Both modes sign the build; whether it publishes to R2 depends on the trigger
# (see PUBLISH below).
#
# HOW TO PICK:
#   * "Run workflow" button (workflow_dispatch) -> a `runner` dropdown picks
#     self-hosted or cloud, and a `publish` toggle picks whether to push to R2.
#   * Pushing a version tag (git tag v0.4.1 && git push --tags) -> always
#     publishes; uses the `DEFAULT_RELEASE_RUNNER` repo variable ("cloud" or
#     "self-hosted"; defaults to self-hosted if unset).
#
# PUBLISH:
#   * Tag push            -> always publishes to R2 (a tag = a real release).
#   * Dispatch, publish=on  -> builds AND publishes to R2 (updates all users).
#   * Dispatch, publish=off -> builds a PRIVATE copy only; nothing is pushed to
#     users. The installer is still attached to the run as an artifact you can
#     download (e.g. for personal use / testing).
#
# ONE-TIME SETUP
#   Self-hosted mode:
#     * Register a self-hosted runner on this PRIVATE repo, labels
#       `self-hosted, windows`. Never attach one to a public repo.
#     * A local folder mirroring the repo root holds the ~250 MB runtime assets;
#       set repo variable ASSETS_DIR to its absolute path. Expected layout:
#         data/lumenlive.db
#         models/bge-base-en-v1.5-int8/{model_quantized.onnx,tokenizer.json}
#         embeddings/kjv-bge-base-en-v1.5.bin
#         embeddings/kjv-bge-base-en-v1.5-ids.bin
#         sdk/ndi/windows/Processing.NDI.Lib.x64.dll
#         src-tauri/libs/{onnxruntime.dll,onnxruntime_providers_shared.dll}
#   Cloud mode:
#     * Nothing extra — it fetches the assets-v4 release with GITHUB_TOKEN.
#   Both modes — repo SECRETS:
#     * TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#     * R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY  (R2 Account API token,
#       Object Read & Write, scoped to the bucket)
#     * R2_ACCOUNT_ID  (=> S3 endpoint <id>.r2.cloudflarestorage.com)
#   Optional repo VARIABLE:
#     * DEFAULT_RELEASE_RUNNER = cloud | self-hosted  (tag-push default)
#
# NOTE ON VERSIONS: when publishing, latest.json (the pointer every client
# checks) is rebuilt from tauri.conf.json's `version` — so keep that version
# correct before a publishing run, or you could point users at the wrong build.
# The verify step enforces tauri.conf.json == package.json first. A publish=off
# dispatch never touches latest.json, so a personal build can't disturb users.
name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: "Platforms to build"
        type: choice
        options:
          - all
          - windows
          - macos
          - macos-publish
        default: all
      source_run:
        description: "Successful run containing macos-bundle (macos-publish only)"
        type: string
      runner:
        description: "Build on"
        type: choice
        options:
          - self-hosted
          - cloud
        default: self-hosted
      publish:
        description: "Publish to R2 (off = build a private copy only, no update pushed to users)"
        type: boolean
        default: true

# Bucket + public download base (must match the updater endpoint in
# tauri.conf.json), and the pinned runtime-assets release used by cloud builds.
env:
  R2_BUCKET: lumenlive-downloads
  DL_BASE: https://lumenlivedl.94streetstudio.xyz
  ASSETS_TAG: assets-v4
  ASSETS_TAR: lumenlive-runtime-assets-v4.tar
  ASSETS_SHA256: 041f2f7319bf9aa2d7af769bb32c422ace2f947339ec18a7a2799d48b9fdb7ff

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.platform != 'macos' && inputs.platform != 'macos-publish') }}
    # Pick the runner: dispatch input wins; otherwise the tag-push default var;
    # otherwise self-hosted. `cloud` -> windows-latest, else the self-hosted
    # Windows runner.
    runs-on: ${{ (inputs.runner == 'cloud' || (inputs.runner == '' && vars.DEFAULT_RELEASE_RUNNER == 'cloud')) && 'windows-latest' || fromJSON('["self-hosted","windows"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up rclone
        uses: AnimMouse/setup-rclone@v1

      # Both runners are Windows, so `powershell` (5.1, always present) is the
      # portable shell here — avoids assuming node/jq/pwsh7 on a bare self-hosted
      # PC. Enforce tauri.conf.json == package.json always; also tag == version
      # on tag pushes. A mismatch ships an update that never triggers or points
      # at the wrong build.
      - name: Verify versions
        shell: powershell
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg  = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "conf=$conf  pkg=$pkg  ref=$env:GITHUB_REF_TYPE/$env:GITHUB_REF_NAME"
          $fail = $false
          if ($conf -ne $pkg) { Write-Host "::error::tauri.conf.json ($conf) != package.json ($pkg)"; $fail = $true }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME -replace '^v',''
            if ($tag -ne $conf) { Write-Host "::error::tag ($tag) != version ($conf)"; $fail = $true }
          }
          if ($fail) { exit 1 }

      # Cloud runners are ephemeral (no persistent target/), so cache the cargo
      # registry + target and the ort-downloaded ONNX Runtime libs (which live
      # outside target and are linked by absolute path). Self-hosted keeps target/
      # on disk between runs, so it skips this.
      - name: Cache Rust build (cloud only)
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          prefix-key: v3-rust
          cache-directories: |
            ~/AppData/Local/ort.pyke.io

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # SELF-HOSTED: stage runtime assets from the local folder. Pure cp, no
      # network; `cp -r "$ASSETS_DIR/." .` merges data/ models/ embeddings/ sdk/
      # and src-tauri/libs/ into the workspace (GNU cp merges existing dirs).
      - name: Stage runtime assets from local folder (self-hosted)
        if: runner.environment == 'self-hosted'
        shell: bash
        env:
          ASSETS_DIR: ${{ vars.ASSETS_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${ASSETS_DIR:-}" ]; then
            echo "::error::Repo variable ASSETS_DIR is not set (path to the local runtime-assets folder)."
            exit 1
          fi
          if [ ! -d "$ASSETS_DIR" ]; then
            echo "::error::ASSETS_DIR '$ASSETS_DIR' does not exist on this runner."
            exit 1
          fi
          echo "Staging runtime assets from: $ASSETS_DIR"
          cp -r "$ASSETS_DIR/." .
          test -f data/lumenlive.db || { echo "::error::data/lumenlive.db missing after staging"; exit 1; }
          test -f src-tauri/libs/onnxruntime.dll || { echo "::error::src-tauri/libs/onnxruntime.dll missing after staging"; exit 1; }

      # CLOUD: fetch the bundled runtime assets from the assets-v4 release (works
      # on a private repo with GITHUB_TOKEN), verify the SHA, extract at the repo
      # root so paths line up with tauri.conf.json -> bundle.resources.
      - name: Fetch runtime assets (cloud)
        if: runner.environment == 'github-hosted'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$ASSETS_TAG" --pattern "$ASSETS_TAR" --clobber
          echo "${ASSETS_SHA256}  ${ASSETS_TAR}" | sha256sum -c -
          tar -xf "$ASSETS_TAR"
          rm -f "$ASSETS_TAR"

      # The staged DB may come from an older asset bundle. Correct its display
      # names in the workspace and fail before packaging if book 66 is missing.
      - name: Normalize and verify bundled Bible names
        run: bun run data/ensure-revelation-name.ts --fix

      # Build the frontend (beforeBuildCommand: bun run build) and bundle the
      # signed NSIS installer. createUpdaterArtifacts=true + the TAURI_SIGNING_*
      # env vars make the bundler emit `<installer>.sig` next to the .exe — the
      # signature embedded in latest.json below.
      - name: Build signed installer
        shell: bash
        env:
          VITE_LUMENBO_URL: https://app.lumenlive.xyz
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --bundles nsis

      # The API base is compiled into the Vite bundle. Fail the release if a
      # production installer accidentally contains the local development URL.
      - name: Validate production API URL
        shell: powershell
        run: |
          $bundles = Get-ChildItem -Path build -Recurse -Filter *.js -File
          if (-not $bundles) { Write-Host "::error::No frontend JavaScript bundles found"; exit 1 }
          $local = $bundles | Select-String -SimpleMatch 'http://localhost:3016'
          if ($local) { Write-Host "::error::Production bundle contains http://localhost:3016"; exit 1 }
          $prod = $bundles | Select-String -SimpleMatch 'https://app.lumenlive.xyz'
          if (-not $prod) { Write-Host "::error::Production API URL was not found in the frontend bundle"; exit 1 }
          Write-Host "Production API URL validation passed."

      # Assemble the Tauri v2 update manifest ourselves (tauri-action only emits
      # it when publishing a GitHub Release, which we don't). Read version from
      # tauri.conf.json, locate installer + .sig, point the URL at R2. Written as
      # UTF-8 without BOM via .NET so serde_json parses it on both PowerShell 5.1
      # and 7. Nothing here echoes a secret.
      - name: Build update manifest (latest.json)
        if: ${{ github.ref_type == 'tag' || inputs.publish }}
        shell: powershell
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::No NSIS *-setup.exe found in bundle/nsis"; exit 1 }
          $sigPath = "$($exe.FullName).sig"
          if (-not (Test-Path $sigPath)) { Write-Host "::error::No .sig next to installer ($sigPath) - are TAURI_SIGNING_* secrets set?"; exit 1 }
          $sig = (Get-Content $sigPath -Raw).Trim()
          $fileName = $exe.Name
          $url = "$env:DL_BASE/v$version/$fileName"

          $manifest = [ordered]@{
            version   = $version
            notes     = "Update to version $version."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{ signature = $sig; url = $url }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText((Join-Path $PWD 'latest.json'), $json, (New-Object System.Text.UTF8Encoding($false)))

          Add-Content -Path $env:GITHUB_ENV -Value "INSTALLER_PATH=$($exe.FullName)" -Encoding ascii
          Add-Content -Path $env:GITHUB_ENV -Value "INSTALLER_NAME=$fileName" -Encoding ascii
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$version" -Encoding ascii
          Write-Host "Generated latest.json:"; Get-Content latest.json

      # Publish to R2 (S3-compatible) via rclone configured from env. Installer +
      # .sig land under a versioned, immutable prefix (cache forever); latest.json
      # sits at the bucket root with no-cache so the updater sees new releases at
      # once. Skipped entirely on a publish=off dispatch.
      - name: Publish to R2
        if: ${{ github.ref_type == 'tag' || inputs.publish }}
        shell: bash
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          set -euo pipefail
          dst="r2:${R2_BUCKET}/v${APP_VERSION}"
          rclone copyto "$INSTALLER_PATH" "${dst}/${INSTALLER_NAME}" \
            --header-upload "Cache-Control: public, max-age=31536000, immutable"
          rclone copyto "${INSTALLER_PATH}.sig" "${dst}/${INSTALLER_NAME}.sig" \
            --header-upload "Cache-Control: public, max-age=31536000, immutable"
          rclone copyto latest.json "r2:${R2_BUCKET}/latest.json" \
            --header-upload "Cache-Control: no-cache, no-store, must-revalidate"

          # Stable "latest" download for the website: a fixed URL that always
          # serves the newest installer, plus its SHA-256 in a companion file.
          # Short TTL so a new release propagates in minutes while downloads
          # still edge-cache. The website links to these and never needs a
          # per-release edit.
          # Extract just the 64-hex digest. Don't `cut` the first field: when the
          # path contains backslashes (Windows), GNU sha256sum escapes the line
          # with a leading "\", which would prepend a stray backslash.
          sha=$(sha256sum "$INSTALLER_PATH" | grep -oiE '[0-9a-f]{64}' | head -1)
          printf '%s  LumenLive-x64-setup.exe\n' "$sha" > LumenLive-x64-setup.exe.sha256
          rclone copyto "$INSTALLER_PATH" "r2:${R2_BUCKET}/download/LumenLive-x64-setup.exe" \
            --header-upload "Cache-Control: public, max-age=300, must-revalidate"
          rclone copyto LumenLive-x64-setup.exe.sha256 "r2:${R2_BUCKET}/download/LumenLive-x64-setup.exe.sha256" \
            --header-upload "Cache-Control: public, max-age=300, must-revalidate"

          # Website release manifest: the marketing site's download page reads
          # this to show the real shipped version (getLatestVersion in
          # lumenweb/src/lib/site-data.ts), so the label tracks the build the
          # stable URL above serves — no per-release edit on the site. The `v`
          # prefix matches the site's version convention. sha256/published are
          # unused for now but leave room to drive the checksum text / a release
          # date from the same source. Same short TTL as the other download/
          # files; the site also caches it for an hour via next.revalidate. It's
          # fetched server-side by the site, so no CORS header is needed here.
          printf '{"version":"v%s","sha256":"%s","published":"%s"}\n' \
            "$APP_VERSION" "$sha" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > download-latest.json
          rclone copyto download-latest.json "r2:${R2_BUCKET}/download/latest.json" \
            --header-upload "Cache-Control: public, max-age=300, must-revalidate"

          echo "Published v${APP_VERSION}"
          echo "  versioned: ${DL_BASE}/v${APP_VERSION}/${INSTALLER_NAME}"
          echo "  latest:    ${DL_BASE}/download/LumenLive-x64-setup.exe  (sha256 $sha)"
          echo "  manifest:  ${DL_BASE}/download/latest.json  (version v${APP_VERSION})"

      # A downloadable copy of the installer on the run itself, regardless of mode.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: warn

  # macOS (Apple Silicon) build. Always cloud (macos-latest is arm64) — you
  # can't build a .app/.dmg on Windows. Runs AFTER `build` so that, when
  # publishing, it merges its `darwin-aarch64` entry into the latest.json the
  # Windows job just wrote (read-modify-write), never the other way round. The
  # build is UNSIGNED by Apple for now: it installs (right-click > Open past
  # Gatekeeper) and auto-update is best-effort. The APPLE_* env below is a
  # drop-in — set those repo secrets later to codesign + notarize with no
  # further workflow change. The updater tarball is still signed with the
  # minisign TAURI_SIGNING_* key regardless, so update signatures are valid.
  build-macos:
    name: Build macOS (Apple Silicon)
    needs: build
    if: ${{ !cancelled() && inputs.platform != 'macos-publish' && (github.event_name != 'workflow_dispatch' || inputs.platform != 'windows') && (needs.build.result == 'success' || (needs.build.result == 'skipped' && !inputs.publish)) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Set up rclone
        uses: AnimMouse/setup-rclone@v1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          prefix-key: v3-rust-macos
          cache-directories: |
            ~/Library/Caches/ort.pyke.io

      - name: Verify versions
        shell: bash
        run: |
          set -euo pipefail
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          echo "conf=$conf pkg=$pkg ref=$GITHUB_REF_TYPE/$GITHUB_REF_NAME"
          fail=0
          if [ "$conf" != "$pkg" ]; then echo "::error::tauri.conf.json ($conf) != package.json ($pkg)"; fail=1; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$conf" ]; then echo "::error::tag ($tag) != version ($conf)"; fail=1; fi
          fi
          [ "$fail" -eq 0 ]

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Neutral, cross-platform runtime assets (DB, embedding model, precomputed
      # embeddings) — the same bundle the Windows cloud build uses. The Windows
      # DLLs inside it are ignored on macOS (not in the macOS resource set). The
      # macOS NDI dylib is committed in git, so the checkout already has it.
      - name: Fetch runtime assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$ASSETS_TAG" --pattern "$ASSETS_TAR" --clobber
          echo "${ASSETS_SHA256}  ${ASSETS_TAR}" | shasum -a 256 -c -
          tar -xf "$ASSETS_TAR"
          rm -f "$ASSETS_TAR"

      - name: Normalize and verify bundled Bible names
        run: bun run data/ensure-revelation-name.ts --fix

      # ort-sys rc.12 links its downloaded macOS runtime statically, so no
      # separate libonnxruntime.dylib needs staging or bundling.
      # Build the frontend + .app + .dmg + updater .app.tar.gz(+.sig). APPLE_*
      # are optional (unset => unsigned); TAURI_SIGNING_* always signs the
      # updater tarball.
      - name: Build macOS bundles
        shell: bash
        env:
          VITE_LUMENBO_URL: https://app.lumenlive.xyz
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Empty optional Apple credentials must behave like unset variables.
          for key in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!key}" ]; then unset "$key"; fi
          done
          bun run tauri build --bundles app,dmg --target aarch64-apple-darwin

      - name: Validate production API URL
        shell: bash
        run: |
          set -euo pipefail
          if grep -rqs 'http://localhost:3016' build; then
            echo "::error::Production bundle contains http://localhost:3016"; exit 1
          fi
          if ! grep -rqs 'https://app.lumenlive.xyz' build; then
            echo "::error::Production API URL was not found in the frontend bundle"; exit 1
          fi
          echo "Production API URL validation passed."

      # Publish to the SAME R2 bucket as Windows, then merge the darwin-aarch64
      # entry into the existing latest.json. Safety: we abort (without
      # re-uploading) unless the manifest we fetched is THIS release's version
      # and still carries windows-x86_64 — so a mac hiccup can never regress
      # Windows auto-update. Skipped on a publish=off dispatch (build-only).
      - name: Publish macOS to R2 + merge latest.json
        if: ${{ github.ref_type == 'tag' || inputs.publish }}
        shell: bash
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          bdir="src-tauri/target/aarch64-apple-darwin/release/bundle"
          dmg=$(ls "$bdir"/dmg/*.dmg 2>/dev/null | head -1 || true)
          tgz=$(ls "$bdir"/macos/*.app.tar.gz 2>/dev/null | head -1 || true)
          sig=$(ls "$bdir"/macos/*.app.tar.gz.sig 2>/dev/null | head -1 || true)
          [ -f "$dmg" ] || { echo "::error::no .dmg produced"; exit 1; }
          [ -f "$tgz" ] || { echo "::error::no .app.tar.gz produced"; exit 1; }
          [ -f "$sig" ] || { echo "::error::no .app.tar.gz.sig produced (TAURI_SIGNING_* set?)"; exit 1; }
          dmgname=$(basename "$dmg")
          tgzname=$(basename "$tgz")

          dst="r2:${R2_BUCKET}/v${version}"
          rclone copyto "$dmg" "${dst}/${dmgname}" --header-upload "Cache-Control: public, max-age=31536000, immutable"
          rclone copyto "$tgz" "${dst}/${tgzname}" --header-upload "Cache-Control: public, max-age=31536000, immutable"
          rclone copyto "$sig" "${dst}/${tgzname}.sig" --header-upload "Cache-Control: public, max-age=31536000, immutable"

          # Stable mac download for the website + checksum (short TTL).
          sha=$(shasum -a 256 "$dmg" | grep -oiE '[0-9a-f]{64}' | head -1)
          printf '%s  LumenLive-aarch64.dmg\n' "$sha" > LumenLive-aarch64.dmg.sha256
          rclone copyto "$dmg" "r2:${R2_BUCKET}/download/LumenLive-aarch64.dmg" --header-upload "Cache-Control: public, max-age=300, must-revalidate"
          rclone copyto LumenLive-aarch64.dmg.sha256 "r2:${R2_BUCKET}/download/LumenLive-aarch64.dmg.sha256" --header-upload "Cache-Control: public, max-age=300, must-revalidate"

          # Merge darwin-aarch64 into the Windows-authored latest.json.
          rclone copyto "r2:${R2_BUCKET}/latest.json" latest.json
          SIGVAL="$(cat "$sig")" URL="${DL_BASE}/v${version}/${tgzname}" VERSION="$version" node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            if (m.version !== process.env.VERSION) {
              console.error(`::error::latest.json version (${m.version}) != this build (${process.env.VERSION}); refusing to merge a stale manifest`);
              process.exit(1);
            }
            m.platforms = m.platforms || {};
            if (!m.platforms["windows-x86_64"] || !m.platforms["windows-x86_64"].url) {
              console.error("::error::latest.json is missing windows-x86_64; refusing to overwrite");
              process.exit(1);
            }
            m.platforms["darwin-aarch64"] = { signature: process.env.SIGVAL, url: process.env.URL };
            fs.writeFileSync("latest.json", JSON.stringify(m, null, 2));
          '
          rclone copyto latest.json "r2:${R2_BUCKET}/latest.json" --header-upload "Cache-Control: no-cache, no-store, must-revalidate"

          echo "Published macOS v${version}"
          echo "  versioned: ${DL_BASE}/v${version}/${dmgname}"
          echo "  latest:    ${DL_BASE}/download/LumenLive-aarch64.dmg  (sha256 $sha)"
          echo "  updater:   ${DL_BASE}/v${version}/${tgzname}"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  publish-macos-artifact:
    name: Publish existing macOS build to R2
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == 'macos-publish' && inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: publish-macos-artifact
      cancel-in-progress: false
    steps:
      - name: Verify source build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || { echo "::error::source_run must be a run ID"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '.conclusion == "success" and .path == ".github/workflows/release.yml" and .head_repository.full_name == $repo' source-run.json
          echo "sha=$(jq -r .head_sha source-run.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Download completed macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-bundle
          path: macos-artifact
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}

      - name: Set up rclone
        uses: AnimMouse/setup-rclone@v1

      # Publish separate Mac download objects. Shared Windows download and
      # updater manifests are deliberately outside this job's destinations.
      - name: Publish and verify macOS download
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          set -euo pipefail
          version=$(jq -r .version src-tauri/tauri.conf.json)
          mapfile -t dmgs < <(find macos-artifact -type f -name '*.dmg')
          [ "${#dmgs[@]}" -eq 1 ] || { echo "::error::Expected exactly one DMG"; exit 1; }
          dmg="${dmgs[0]}"
          filename=$(basename "$dmg")
          sha=$(sha256sum "$dmg" | cut -d ' ' -f 1)
          versioned="v${version}/macos/${filename}"
          stable="download/LumenLive-aarch64.dmg"
          rclone copyto "$dmg" "r2:${R2_BUCKET}/${versioned}" --immutable --header-upload "Cache-Control: public, max-age=31536000, immutable"
          rclone copyto "$dmg" "r2:${R2_BUCKET}/${stable}" --header-upload "Cache-Control: public, max-age=300, must-revalidate"
          printf '%s  LumenLive-aarch64.dmg\n' "$sha" > macos.sha256
          rclone copyto macos.sha256 "r2:${R2_BUCKET}/${stable}.sha256" --header-upload "Cache-Control: public, max-age=300, must-revalidate"
          jq -n --arg version "v$version" --arg sha256 "$sha" --arg url "$DL_BASE/$stable" --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{version:$version,platform:"darwin-aarch64",sha256:$sha256,url:$url,published:$published}' > macos-latest.json
          rclone copyto macos-latest.json "r2:${R2_BUCKET}/download/macos/latest.json" --header-upload "Cache-Control: public, max-age=300, must-revalidate"
          # Read the uploaded binary back through its public versioned URL.
          curl --fail --location --retry 3 "$DL_BASE/$versioned" -o verified.dmg
          printf '%s  verified.dmg\n' "$sha" | sha256sum -c -
          printf 'Mac download: %s/%s\nVersioned download: %s/%s\nSHA-256: %s\n' "$DL_BASE" "$stable" "$DL_BASE" "$versioned" "$sha" >> "$GITHUB_STEP_SUMMARY"
