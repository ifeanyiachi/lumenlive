# Installer build — produces the desktop installers in the cloud.
#
# TRIGGERS (never on a plain commit):
#   * pushing a version tag  (git tag v0.1.0 && git push --tags)  -> builds AND
#     publishes the installers to a GitHub Release for that tag.
#   * the "Run workflow" button (workflow_dispatch)               -> builds and
#     uploads the installers as run artifacts, without publishing a release.
#
# Each run: fetches the ~1 GB runtime assets from the `assets-v2` release (the
# models / bible DB / embeddings that are too big for git), extracts them to the
# repo root, then compiles the Rust workspace and bundles the installer.
#
# Currently WINDOWS ONLY. To add macOS: uncomment the macos entry in the matrix
# below, and give tauri.conf.json per-platform `bundle.resources` (the native
# libs differ: .dll vs .dylib) plus a `dmg`/`app` bundle target.
name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The release-publish step needs write access to create/upload release assets.
permissions:
  contents: write

# The pinned release holding the bundled runtime assets (see the assets-v2
# GitHub Release). Bump this if you ever regenerate the models/DB/embeddings.
env:
  ASSETS_TAG: assets-v2
  ASSETS_TAR: lumenlive-runtime-assets-v2.tar
  ASSETS_SHA256: 44220030cedb45166c1dadf8b710a67eb754415fbdcde14152e30635447dae5a

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          # --- add macOS here once tauri.conf.json has per-platform resources:
          # - platform: macos-latest
          #   bundles: dmg
          # - platform: ubuntu-22.04
          #   bundles: appimage

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Fail fast (before the ~1 GB asset fetch and Rust compile) if the pushed
      # tag doesn't match the app version. The tag drives the GitHub Release and
      # thus the update manifest's URL, while tauri.conf.json's version is what
      # the running app compares against — a mismatch ships an update that either
      # never triggers or points users at the wrong build. package.json is kept
      # in lockstep too so the two version sources never drift. Tag `v0.2.3`
      # must equal both versions `0.2.3`. Only runs on tag pushes.
      - name: Verify tag matches app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag  tauri.conf.json=$conf  package.json=$pkg"
          fail=0
          if [ "$tag" != "$conf" ]; then
            echo "::error::Tag '$tag' != tauri.conf.json version '$conf'"
            fail=1
          fi
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag '$tag' != package.json version '$pkg'"
            fail=1
          fi
          exit $fail

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches the cargo registry + target dir keyed on the workspace, so only
      # the first build compiles the whole dependency tree from scratch.
      #
      # cache-directories ALSO caches the native libraries that the sherpa-rs and
      # ort build scripts download to AppData (sherpa-onnx + ONNX Runtime). These
      # live outside `target` and are referenced by absolute LIBPATH at link time.
      # Without them cached, a warm-cache run that only recompiles Rust source
      # skips those build scripts (their fingerprint is unchanged) and the final
      # link fails with `LNK1181: cannot open input file 'cargs.lib'`. prefix-key
      # is bumped so the first run after this change repopulates a complete cache.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          prefix-key: v2-rust
          cache-directories: |
            ~/AppData/Local/sherpa-rs
            ~/AppData/Local/ort.pyke.io

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Pull the bundled runtime assets and extract them at the repo root so the
      # paths line up with tauri.conf.json -> bundle.resources. Verify the SHA
      # so a corrupted/replaced asset fails loudly instead of shipping.
      - name: Fetch runtime assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$ASSETS_TAG" --pattern "$ASSETS_TAR" --clobber
          echo "${ASSETS_SHA256}  ${ASSETS_TAR}" | sha256sum -c -
          tar -xf "$ASSETS_TAR"
          rm -f "$ASSETS_TAR"

      # Builds the frontend (beforeBuildCommand: bun run build) and bundles the
      # installer. On a tag push, tauri-action also creates/updates the GitHub
      # Release for that tag and uploads the installer to it; on manual dispatch
      # (no tag) it just builds, and the artifact step below captures the output.
      #
      # SIGNED UPDATES: because tauri.conf.json sets bundle.createUpdaterArtifacts
      # = true, the presence of the TAURI_SIGNING_* env vars makes tauri-action
      # sign each installer and emit `latest.json` (the update manifest the app
      # fetches). It uploads latest.json + the .sig alongside the installer on a
      # tag push. Without these secrets the build still succeeds but produces no
      # update manifest, so the in-app updater would find nothing.
      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('LumenLive {0}', github.ref_name) || '' }}
          releaseDraft: true
          args: --bundles ${{ matrix.bundles }}

      # Always keep the installer downloadable from the run itself — useful for
      # manual (untagged) test builds.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/release/bundle/**/*-setup.exe.sig
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/latest.json
          if-no-files-found: warn
